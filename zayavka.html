<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Заявки · ASA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Мини-приложение @sysarchitect_bot: меню, заявка, вопрос, документы — всё на одном экране.
   Дизайн-система «ASA Заявки Mini App», демо — ПРИЛОЖЕНИЯ/zayavki-miniapp-demo */
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--f:"Oswald","Arial Narrow",Arial,sans-serif}
html[data-theme="light"]{--bg:#e4e2e3;--card:#f7f6f6;--ink:#414143;--muted:#676769;--line:#41414329;--graphite:#2c3341;--on-graphite:#fff;--mint:#b4fab2;--on-mint:#2c3341;--orange:#fe640c;--focus:#2c3341;--shadow:0 10px 24px rgba(65,65,67,.14),0 2px 4px rgba(65,65,67,.08);--float:0 12px 30px rgba(65,65,67,.25)}
html[data-theme="dark"]{--bg:#1c2029;--card:#2c3341;--ink:#f6f6f6;--muted:#b9bdbf;--line:#f6f6f624;--graphite:#11151c;--on-graphite:#f6f6f6;--mint:#b4fab2;--on-mint:#2c3341;--orange:#fe640c;--focus:#b4fab2;--shadow:0 10px 24px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.25);--float:0 12px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{margin:12px 16px 0;display:flex;align-items:center;gap:10px;background:var(--graphite);color:var(--on-graphite);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
.top .bk{flex:none;width:34px;height:34px;border-radius:50%;background:#ffffff1a;display:grid;place-items:center;transition:width .35s var(--ease),opacity .25s,margin .35s var(--ease)}
.top .bk.hide{width:0;opacity:0;margin-right:-10px;pointer-events:none}
.top .ttl{flex:1;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px}
.top .ttl b{color:var(--mint);font-weight:600}
.seg{position:relative;flex:none;display:flex;background:#ffffff1a;border-radius:999px;padding:3px}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--mint);transition:transform .35s var(--spring)}
.seg[data-v="en"]::before{transform:translateX(100%)}
.seg button{position:relative;z-index:1;width:42px;padding:5px 0;font-size:13px;font-weight:600;letter-spacing:.06em;color:#b9bdbf;transition:color .25s}
.seg button[aria-pressed="true"]{color:#2c3341}

.prog{margin:14px 16px 0;display:flex;align-items:center;gap:12px;height:16px;transition:opacity .3s,height .3s,margin .3s}
.prog.hide{opacity:0;height:0;margin-top:0}
.prog .track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar{height:100%;width:0;border-radius:3px;background:var(--orange);transition:width .6s var(--ease)}
.prog .cnt{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:70px;text-align:right}

.views{position:relative;flex:1;overflow:hidden;overflow:clip} /* clip: фокус в поле не сдвигает экраны вбок */
.view{position:absolute;inset:0;overflow-y:auto;padding:16px 16px 130px;opacity:0;transform:translateX(48px);filter:blur(6px);pointer-events:none;visibility:hidden;transition:opacity .45s var(--ease),transform .55s var(--ease),filter .45s var(--ease),visibility 0s .55s;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.left{transform:translateX(-48px)}
.view.on{opacity:1;transform:none;filter:none;pointer-events:auto;visibility:visible;transition-delay:0s}
.view.on .st{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

h2{font-size:26px;line-height:1.1;font-weight:600;margin:4px 0 6px;text-transform:uppercase;letter-spacing:.01em}
.sub{font-size:14px;color:var(--muted);margin:0 0 16px}

.hero{display:grid;grid-template-columns:1fr;gap:10px 12px;border-radius:24px;background:var(--graphite);color:var(--on-graphite);box-shadow:var(--shadow);padding:16px}
.hero .hk{font-size:30px;line-height:1;font-weight:600;text-transform:uppercase}
.hero .hk b{display:block;color:var(--mint);font-weight:600}
.hero .hs{margin-top:8px;font-size:13px;color:#b9bdbf;}
.hero .free{grid-column:1/-1;justify-self:start;margin-top:6px;background:var(--mint);color:var(--on-mint);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

/* главное меню */
.menu{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.mi{width:100%;display:flex;gap:14px;align-items:center;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);text-align:left;transition:transform .2s var(--ease),background .3s}
.mi:active{transform:scale(.98)}
.mi .ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--graphite);color:var(--mint);display:grid;place-items:center}
.mi .tx{flex:1}
.mi b{display:block;font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.mi small{font-size:13px;color:var(--muted)}
.mi .go{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;transition:transform .3s var(--ease)}
.mi:hover .go{transform:translateX(3px)}
.mi.main{background:var(--mint);color:var(--on-mint)}
.mi.main small{color:#2c3341cc}
.mi.main .ic{background:#2c3341}
.mi.main .go{background:#2c33411a}
.note{margin:14px 4px 0;font-size:13px;color:var(--muted);text-align:center}

.dirs,.docs{display:flex;flex-direction:column;gap:10px}
.dir{background:var(--card);border-radius:20px;box-shadow:var(--shadow);transition:background .35s var(--ease),transform .2s var(--ease),color .35s}
.dir:active{transform:scale(.98)}
.dir .hd{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left}
.dir .ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--graphite);color:var(--mint);display:grid;place-items:center;transition:transform .45s var(--spring)}
.dir .t{flex:1;font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;line-height:1.2}
.dir .rd{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;transition:border-color .3s}
.dir .rd::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--on-mint);transform:scale(0);transition:transform .35s var(--spring)}
.dir .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.dir .bd>div{overflow:hidden}
/* описание — обычным читаемым шрифтом, заголовки остаются Oswald */
.dir .bd p{margin:0;padding:0 14px 12px 16px;font:400 14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:0;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .4s var(--ease)}
html[data-theme="light"] .dir .bd p{color:#414143}
/* компактно: в раскрытой карточке без пустоты между заголовком и описанием (правило Екатерины 28.10) */
.dir.sel .hd{padding-bottom:2px}
.dir .bd a{color:inherit;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.dir.sel{background:var(--mint);color:var(--on-mint)}
.dir.sel .ic{transform:rotate(-8deg) scale(1.06);background:#2c3341}
.dir.sel .rd{border-color:var(--on-mint)}
.dir.sel .rd::after{transform:scale(1)}
.dir.sel .bd{grid-template-rows:1fr}
.dir.sel .bd p{opacity:1;transform:none;transition-delay:.12s}

.fld{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.fld label{font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.fld label i{color:var(--orange);font-style:normal}
.fld textarea,.fld input{font:400 16px/1.45 var(--f);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);transition:border-color .2s;width:100%}
.fld textarea{resize:none;height:104px}
.fld textarea.tall{height:160px}
.fld textarea::placeholder,.fld input::placeholder{color:var(--muted)}
.fld textarea:focus,.fld input:focus{outline:none;border-color:var(--focus)}
.fld .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.fld .meta .ok{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;transition:background .3s,color .3s,transform .35s var(--spring),border-color .3s}
.chip[aria-pressed="true"]{background:var(--mint);color:var(--on-mint);border-color:var(--mint);transform:scale(1.04);font-weight:600}

.cons{display:flex;flex-direction:column;gap:10px}
.con{background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.con .hd{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--muted);display:grid;place-items:center;transition:background .25s,border-color .25s,transform .35s var(--spring)}
.box path{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s var(--ease) .05s}
.con.ck .box{background:var(--mint);border-color:var(--mint);transform:scale(1.08)}
.con.ck .box path{stroke-dashoffset:0}
.con .tx{flex:1;font-size:14px;line-height:1.35;text-align:left}
.con .tx small{color:var(--muted)}
.con .mo{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:transform .4s var(--ease)}
.con.open .mo{transform:rotate(180deg)}
.con .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.con .bd>div{overflow:hidden}
.con .bd p{margin:0;padding:0 16px 14px 52px;font-size:13px;line-height:1.45;color:var(--muted)}
.con .bd button{color:var(--ink);text-decoration:underline;text-underline-offset:2px;font-size:13px}
.con.open .bd{grid-template-rows:1fr}

.doc{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);text-align:left;transition:transform .2s var(--ease)}
.doc:active{transform:scale(.98)}
.doc .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--graphite);color:var(--mint);display:grid;place-items:center}
.doc b{display:block;font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.doc small{font-size:13px;color:var(--muted)}

.done{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:32px}
.mark{position:relative;width:112px;height:112px;border-radius:50%;background:var(--mint);color:var(--on-mint);display:grid;place-items:center;margin-bottom:22px;transform:scale(0)}
.view.on .mark{animation:pop .7s var(--spring) .15s forwards}
.mark path{stroke-dasharray:40;stroke-dashoffset:40}
.view.on .mark path{animation:draw .5s var(--ease) .6s forwards}
.mark::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid var(--mint);opacity:0}
.view.on .mark::before{animation:ring 1.2s var(--ease) .5s}
@keyframes pop{to{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
.bit{position:absolute;left:50%;top:50%;height:12px;width:26px;border-radius:6px;pointer-events:none;animation:fly 1.1s var(--ease) forwards}
@keyframes fly{from{transform:translate(-50%,-50%) rotate(0);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--rot));opacity:0}}
.done h2{font-size:28px}
.done .sub{max-width:290px}
.btns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:8px}
.btn{height:52px;border-radius:999px;font-size:15px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.mint{background:var(--mint);color:var(--on-mint)}
.btn.dark{background:var(--graphite);color:var(--on-graphite)}
.btn.ghost{background:var(--card);color:var(--ink)}

/* нижняя шторка: подтверждение, документ, уведомление */
.dim{position:fixed;inset:0;background:#0b0d12;opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
.dim.on{opacity:.45;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .5s var(--ease);z-index:21;padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheet .sh b{font-size:20px;font-weight:600;text-transform:uppercase}
.sheet .x{flex:none;width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.sheet .sb{overflow-y:auto;flex:1;min-height:0}
.sheet iframe{width:100%;height:62vh;border:0;border-radius:16px;background:#fff}
.sum{background:var(--card);border-radius:16px;padding:4px 16px 14px;box-shadow:var(--shadow);margin-bottom:12px}
.sum dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.sum dd{margin:2px 0 0;font-size:15px;line-height:1.4;word-break:break-word}
.sheet .btns{margin-top:4px}

.mb{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;background:linear-gradient(to top,var(--bg) 65%,transparent);z-index:5;transition:transform .5s var(--ease)}
.mb.hide{transform:translateY(130%)}
.mainbtn{position:relative;height:54px;width:100%;border-radius:999px;background:var(--mint);color:var(--on-mint);font-size:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;box-shadow:var(--float);overflow:hidden;transition:width .45s var(--ease),opacity .3s,transform .2s var(--ease)}
.mainbtn:active{transform:scale(.97)}
.mainbtn.off{opacity:.5}
.mainbtn .lbl{display:inline-flex;align-items:center;gap:8px;transition:opacity .2s}
.mainbtn.load{width:54px}
.mainbtn.load .lbl{opacity:0}
.spin{position:absolute;inset:15px;border-radius:50%;border:3px solid #2c334133;border-top-color:#2c3341;opacity:0;animation:spin .8s linear infinite}
.load .spin{opacity:1;transition:opacity .2s .25s}
.btn.mint{position:relative;overflow:hidden}
.btn.load .lbl{opacity:0}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--graphite);color:var(--on-graphite);border-radius:999px;padding:9px 16px;font-size:13px;letter-spacing:.03em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--spring);z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* мелкий текст по всему хабу — системный шрифт телефона, чёрный (правило Екатерины 28.10) */
.sub,.mi small,.note,.fld .meta,.con .tx,.con .bd p,.con .bd button,.doc small,.sum dd,.sheet .sb,textarea,input,.toast{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:0;font-weight:400}
.sub,.mi small,.note,.fld .meta,.con .bd p,.doc small{color:#414143;font-size:14px}
.hero .hs{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:0;font-weight:400}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="bk hide" id="bk" aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="ttl" id="ttl"></span>
    <div class="seg" id="seg" data-v="ru"><button data-l="ru" aria-pressed="true">RU</button><button data-l="en" aria-pressed="false">EN</button></div>
  </div>
  <div class="prog hide" id="prog"><div class="track"><div class="bar" id="bar"></div></div><span class="cnt" id="cnt"></span></div>

  <div class="views">
    <section class="view on" data-v="home">
      <div class="hero st" style="--i:0">
        <div><div class="hk"><span data-t="hk1"></span><b data-t="hk2"></b></div>
        <div class="hs" data-t="hs"></div></div>
        <span class="free" data-t="free"></span>
      </div>
      <div class="menu">
        <button class="mi main st" style="--i:1" data-go="req"><span class="ic" data-ic="pen"></span><span class="tx"><b data-t="m1"></b><small data-t="m1s"></small></span><span class="go" data-ic="arrow"></span></button>
        <button class="mi st" style="--i:2" data-go="ask"><span class="ic" data-ic="chat"></span><span class="tx"><b data-t="m2"></b><small data-t="m2s"></small></span><span class="go" data-ic="arrow"></span></button>
        <button class="mi st" style="--i:3" data-go="docs"><span class="ic" data-ic="doc"></span><span class="tx"><b data-t="m3"></b><small data-t="m3s"></small></span><span class="go" data-ic="arrow"></span></button>
      </div>
      <p class="note st" style="--i:4" data-t="note"></p>
    </section>

    <section class="view" data-v="dir">
      <h2 class="st" style="--i:0" data-t="s1"></h2>
     <div class="dirs" id="dirs"></div>
    </section>

    <section class="view" data-v="task">
      <h2 class="st" style="--i:0" data-t="s2"></h2>
      <p class="sub st" style="--i:1" data-t="s2h"></p>
      <div class="fld st" style="--i:2" id="fGoal">
        <label for="goal"><span data-t="goal"></span> <i>*</i></label>
        <textarea id="goal" maxlength="500"></textarea>
        <div class="meta"><span data-t="goalH"></span><span id="cc">0 / 500</span></div>
      </div>
      <div class="fld st" style="--i:3"><label for="nm" data-t="name"></label><input id="nm" maxlength="80" autocomplete="given-name"></div>
      <div class="fld st" style="--i:4" id="fTg"><label for="tgn"><span data-t="tg"></span> <i>*</i></label><input id="tgn" maxlength="64"></div>
      <div class="fld st" style="--i:5"><label data-t="when"></label><div class="chips" id="when"></div></div>
    </section>

    <section class="view" data-v="cons">
      <h2 class="st" style="--i:0" data-t="s3"></h2>
      <p class="sub st" style="--i:1" data-t="s3h"></p>
      <div class="cons" id="cons"></div>
    </section>

    <section class="view" data-v="ask">
      <h2 class="st" style="--i:0" data-t="a1"></h2>
      <p class="sub st" style="--i:1" data-t="a1h"></p>
      <div class="fld st" style="--i:2" id="fAsk">
        <label for="q"><span data-t="a2"></span> <i>*</i></label>
        <textarea id="q" class="tall" maxlength="1000"></textarea>
        <div class="meta"><span data-t="a2h"></span><span id="qc">0 / 1000</span></div>
      </div>
    </section>

    <section class="view" data-v="docs">
      <h2 class="st" style="--i:0" data-t="d1"></h2>
      <p class="sub st" style="--i:1" data-t="d1h"></p>
      <div class="docs" id="docs"></div>
    </section>

    <section class="view" data-v="done">
      <div class="done">
        <div class="mark" id="mark"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2 class="st" style="--i:6" id="dT"></h2>
        <p class="sub st" style="--i:7" id="dS"></p>
        <div class="btns st" style="--i:8">
          <button class="btn mint" id="toHome" data-t="toHome"></button>

  return j;
 }
 if(tg&&body.action!=='me'){tg.sendData(JSON.stringify(body));return {status:'ok'}} // старый путь: кнопка клавиатуры, приложение закроется
 if(body.action==='me')return null;
 await new Promise(r=>setTimeout(r,700));return {status:'ok'}; // открыто в браузере — показ без отправки
}
let busy=false;
async function send(action,btn){
 if(busy)return;busy=true;btn.classList.add('load');
 try{
  await api(payload(action));
  if(sheetOn())closeSheet();
  S.consented=true;
  $('#dT').textContent=t(action==='question'?'qT':'dT');$('#dS').textContent=t(action==='question'?'qS':'dS');
  if(action==='question')$('#q').value='';else{S.dirs=[];$('#goal').value='';S.when=0;renderDirs();renderWhen()}
  hap('success');S.stack=['home','done'];render();
 }catch(e){toast(t(e.message==='slow'?'slow':'err'));hap('error')}
 finally{busy=false;btn.classList.remove('load')}
}
function burst(){
 const m=$('#mark'),cols=['#b4fab2','#fe640c','#f7f6f6','#2c3341'];
 for(let i=0;i<16;i++){const b=document.createElement('span');b.className='bit';const a=Math.PI*2*i/16+Math.random()*.4,r=90+Math.random()*70;
  b.style.cssText=`background:${cols[i%4]};--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px;--rot:${Math.random()*360}deg;width:${i%3?26:12}px`;
  m.appendChild(b);setTimeout(()=>b.remove(),1200)}
}
$('#goal').oninput=sync;$('#tgn').oninput=sync;$('#q').oninput=sync;
function setLang(l){S.lang=l;$('#seg').dataset.v=l;$$('#seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.l===l));texts()}
$$('#seg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));

let ei=0,ci=0,del=false;
setInterval(()=>{const g=$('#goal');if(g.value||document.activeElement===g)return;const s=T[S.lang].ex[ei%4];
 if(!del){ci++;if(ci>s.length+12)del=true}else{ci-=3;if(ci<=0){ci=0;del=false;ei++}}
 g.placeholder=s.slice(0,Math.min(ci,s.length))+(ci<=s.length?'|':'')},70);

setLang(S.lang);
try{const c=JSON.parse(localStorage.getItem('asaCons')||'null');if(c){S.cons=c;S.consented=true}}catch(e){}
if(!S.consented){S.mode='entry';S.stack=['cons'];render()}
// согласие и язык, которые человек уже выбрал в боте
api({action:'me'}).then(j=>{if(!j)return;S.consented=S.consented||!!j.consent;if(j.consent&&S.mode==='entry'){S.mode='req';home()}if(!qs.get('lang')&&j.lang&&j.lang!==S.lang)setLang(j.lang);sync()}).catch(()=>{});
</script>
