<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ArchitectSystemsAI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap">
<style>
/* Мини-приложение ASA — стиль гайда security-en (шаблон лид-магнитов 11.10): графит, оранжевый, мятный, Oswald */
:root{
  --bg:#FFFFFF;--card:#F7F6F6;--white:#fff;--ink:#414143;--gray:#676769;
  --orange:#FE640C;--mint:#B4FAB2;--graphite:#2c3341;
  --f:"Oswald","Arial Narrow",Arial,sans-serif;
  --shadow:0 10px 24px rgba(65,65,67,.14),0 2px 4px rgba(65,65,67,.08);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;letter-spacing:.01em;-webkit-font-smoothing:antialiased;padding-bottom:96px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 0}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#676769;color:var(--white);border-radius:999px;padding:7px 7px 7px 18px;box-shadow:var(--shadow)}
.brand{font-weight:600;font-size:18px;letter-spacing:.01em}
.brand b{color:var(--mint);font-weight:600}
.lang{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.lang button{padding:5px 12px;border-radius:999px;font-weight:600;font-size:13px;letter-spacing:.06em;color:#b9bdbf}
.lang button.on{background:var(--mint);color:var(--graphite)}
.hello{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px;padding-bottom:14px;border-bottom:1px solid rgba(65,65,67,.15)}
.hello h1{margin:0;font-size:24px;font-weight:500;text-transform:none}
.hello h1 span{color:var(--gray);font-weight:400}
.ava{width:44px;height:44px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.ava img{width:100%;height:100%;object-fit:cover}

/* витрина */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;margin:10px -16px 0;padding:6px 16px 14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
/* витрина: 4 компактные тёмные карточки, в каждой панель — главное о проекте печатается строка за строкой.
   бренд по правилу — первое слово белым, второе мятным, без обводки */
.feat{flex:0 0 min(80%,300px);scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;background:#676769;color:var(--white);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
/* подпись под логотипом — спокойная, не оранжевая (оранжевым только выделяем) */
.kick{font:500 10.5px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.06em;color:var(--mint);opacity:.8;margin-top:-3px}
.panel-top b{color:var(--mint);font-weight:600}
/* AgentProof: «Проверяет всю цепочку» — пункты выезжают по одному */
.chk{padding:8px 12px 2px;min-height:136px}
.chk small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#ffffff;margin-bottom:6px}
.chk ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.chk li{display:flex;align-items:center;gap:6px;font-size:13.5px;white-space:nowrap;font-weight:600;color:#fff;animation:pop .35s ease both}
.chk li::before{content:"✓";display:grid;place-items:center;width:17px;height:17px;border-radius:5px;background:var(--mint);color:var(--graphite);font-size:11px;font-weight:700;flex:none}
.chk .fx{margin:8px 0 0;font-size:11.5px;color:var(--mint);min-height:16px}
.feat h2{margin:0;font-size:19px;font-weight:600;text-transform:uppercase;line-height:1.15;display:flex;align-items:center;gap:7px}
.feat .g{color:var(--mint)}
.stage{position:relative;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.18);display:flex;flex-direction:column}
.panel-top{display:flex;align-items:center;gap:5px;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.07);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#ffffff}
.panel-top i{width:7px;height:7px;border-radius:50%;background:#ffffff}
.panel-top i:first-child{background:var(--orange)}.panel-top i:nth-child(3){background:var(--mint)}
.panel-top span{margin-left:5px}
.caret{display:inline-block;width:6px;height:12px;background:var(--mint);vertical-align:-2px;margin-left:2px}
.stage .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 12px 12px;color:var(--white);font-size:13px}
.score b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.score em{font-style:normal;color:var(--mint)}
.score small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#FD6207}
.open{background:var(--mint);color:var(--graphite);border-radius:999px;padding:8px 16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px}
/* значок AUDIT — весы в мятном круге, качаются; маленькие, в углу панели (не убирать) */
.scales{position:absolute;right:10px;top:38px;width:54px;height:54px}
.scales svg{width:100%;height:auto;overflow:visible}
.scales .st{fill:none;stroke:#d9dde3;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.scales .rg{fill:none;stroke:var(--mint);stroke-width:7;filter:drop-shadow(0 0 4px rgba(180,250,178,.55))}
.scales .beam{transform-box:view-box;transform-origin:100px 64px;animation:sway 3.2s ease-in-out infinite}
.scales .pan{transform-box:view-box;animation:hang 3.2s ease-in-out infinite}
.scales .pl{transform-origin:48px 64px}.scales .pr{transform-origin:152px 64px}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes hang{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}}
/* логотипы проектов — как на их сайтах */
.lg-ap{display:flex;align-items:center;gap:7px}.lg-ap svg{width:28px;height:28px;flex:none}
.lg-app{display:flex;align-items:center;gap:8px;font-size:17px;letter-spacing:.06em}
.lg-app i{width:12px;height:12px;border-radius:50%;border:2px solid var(--mint);display:grid;place-items:center;flex:none}
.lg-app i::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--mint)}
.lg-au{font-size:inherit;line-height:1.15;color:var(--mint);letter-spacing:.02em}
.lg-asa{text-transform:none;font-size:19px}.lg-asa b{color:var(--mint);font-weight:600}
/* APP: промпт собирается на глазах */
.ask{margin:10px 12px 0;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.06);font-size:12px;color:#e6e9ee;min-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat h2{min-height:30px}.feat .stage{flex:1}.feat .stage .bar{margin-top:auto}
.ask small{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#ffffff}
.agents{display:flex;gap:4px;align-items:center;margin:8px 12px 0;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#ffffff;min-height:14px}
.agents b{width:9px;height:9px;border-radius:50%;background:#ffffff;transition:background .3s}.agents b.on{background:var(--mint)}
.prompt{margin:8px 12px 0;padding:8px 10px;border-radius:10px;border:1px solid rgba(180,250,178,.35);font:11px/1.45 ui-monospace,Consolas,monospace;color:#e6e9ee;min-height:96px}
.prompt p{margin:0 0 2px}
.ft{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:0;white-space:nowrap}.au-ask{margin-right:74px}.prompt.one{min-height:84px;line-height:1.3}.chk.one ul{grid-template-columns:1fr;gap:3px}.prompt em{font-style:normal;color:var(--mint)}
.prompt[data-f="app"]{min-height:84px;line-height:1.3;display:grid;grid-template-columns:1fr 1fr;align-content:start;column-gap:8px}
.score b:has(.ps){white-space:nowrap;display:inline-flex;align-items:center}
.score .ps{font:400 13px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;font-style:normal;margin-left:4px}
.prompt .more{margin-top:0;color:var(--mint)}
/* AUDIT: свой серый, как на audit.arsysai.com */
.field{margin:10px 74px 0 12px;padding:7px 10px;border-radius:10px;border:1px solid var(--mint);background:#4a4f56;font-size:12px;color:#fff;min-height:32px}
.field small{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#d5d9dd}
.report{margin:8px 12px 0;font:11px/1.5 ui-monospace,Consolas,monospace;color:#fff;min-height:84px}
.report p{margin:0 0 2px}.report .warn{color:#ffd2b8}.report .ok{color:var(--mint)}.report b{color:var(--mint)}
/* На заказ: услуги выезжают карточками */
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px 4px;min-height:136px;align-content:flex-start}
.chips span{padding:5px 9px;border-radius:999px;background:rgba(180,250,178,.12);border:1px solid rgba(180,250,178,.4);color:#e6f8e6;font-size:11px;animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* листание витрины на компьютере: стрелки и точки */
.nav-rail{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:-4px}
.nav-rail .ar{width:30px;height:30px;border-radius:50%;background:var(--white);box-shadow:var(--shadow);font-size:18px;line-height:1;color:var(--ink)}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(65,65,67,.25);cursor:pointer}
.dots i.on{background:var(--orange);width:18px;border-radius:3px}

/* вкладки */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:7px 14px;border-radius:999px;font-weight:500;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--gray)}
.tabs button.on{background:#676769;color:var(--white)}
.free{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;margin:12px 0;box-shadow:var(--shadow);font-size:15px}
.free b{background:var(--mint);color:var(--graphite);border-radius:999px;padding:3px 10px;font-size:12px;letter-spacing:.08em;flex:none}

/* лента */
.feed{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;background:var(--white);border-radius:20px;padding:14px;box-shadow:var(--shadow);animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--graphite);color:var(--mint);display:grid;place-items:center}
.si{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .si{width:18px;height:18px}
.ic.o{background:var(--orange);color:var(--white)}
.ic.m{background:var(--mint);color:var(--graphite)}
.it{min-width:0;flex:1;align-self:center}
.acc{flex-direction:column;gap:0;cursor:pointer}.acc .hd{display:flex;gap:12px;align-items:center}.acc .go{transition:transform .25s}.acc.open .go{transform:rotate(90deg)}
.acc .bd{display:none;padding:10px 0 2px}.acc.open .bd{display:block}.acc .bd p{text-transform:none;letter-spacing:0;font-weight:400;margin:0 0 10px;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#414143}
.acc .btn{background:var(--mint);color:var(--graphite);border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.meta{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);font-weight:600}
.it h3{margin:2px 0 2px;font-size:17px;font-weight:600;text-transform:uppercase;line-height:1.2}
.it p{margin:0;color:var(--gray);font-weight:300;font-size:14px}
.go{align-self:center;flex:none;width:36px;height:36px;border-radius:50%;background:var(--white);display:grid;place-items:center;box-shadow:var(--shadow);font-size:18px}
.soon{display:inline-block;white-space:nowrap;font-size:11px;letter-spacing:.06em;background:var(--white);border-radius:999px;padding:2px 8px;color:var(--gray);margin-left:6px;vertical-align:2px}

/* профиль */
.pf{display:none;flex-direction:column;gap:10px;margin-top:16px}
.pf a,.pf button{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);font-size:16px;font-weight:500;text-transform:uppercase;letter-spacing:.03em;text-align:left;width:100%}
.pf .cta{background:var(--mint);color:var(--graphite)}

/* нижняя панель */
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;background:var(--white);border-radius:999px;padding:5px;box-shadow:0 12px 30px rgba(65,65,67,.25)}
.nav button{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--gray)}
.nav button.on{background:#676769;color:var(--white)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* мелкий текст по всему хабу — системный шрифт телефона, чёрный (правило Екатерины 28.10) */
.it p,.free{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:0;font-weight:400}
.it p{color:#414143}
/* согласия: один экран при первом входе (29.10.2026) */
#cons{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:16px 16px 24px}
#cons h2{margin:6px 0 4px;font-size:24px;font-weight:600;text-transform:uppercase}
#cons .sub{margin:0 0 12px;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#414143}
.cn{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:20px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#414143;text-align:left;width:100%}
.cn i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #c9c9cb;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700}
.cn.on i{background:var(--mint);border-color:var(--mint);color:var(--graphite)}.cn.on i::before{content:"✓"}
.cn span{flex:1}.cn small{color:var(--gray)}
.cn a{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid #c9c9cb;display:grid;place-items:center;font-size:13px;color:#414143;text-decoration:none}
#consGo{width:100%;margin-top:8px;padding:14px;border-radius:20px;background:var(--mint);color:var(--graphite);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
#consGo:disabled{opacity:.45}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">ArchitectSystems<b>AI</b></div>
    <div class="lang"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
  </div>
  <div class="hello"><h1><span data-t="hi"></span> <b id="nm"></b></h1><div class="ava" id="ava"></div></div>

  <section id="home">
    <div class="rail" id="rail"></div>
    <div class="nav-rail"><button class="ar" data-s="-1" aria-label="Назад">‹</button><div class="dots" id="dots"></div><button class="ar" data-s="1" aria-label="Вперёд">›</button></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="free"><b data-t="freeB"></b><span data-t="free"></span></div>
    <div class="feed" id="feed"></div>
  </section>

  <section class="pf" id="profile"></section>
</div>

<div class="nav">
  <button class="on" data-v="home"><svg class="si" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="home"></span></button>
  <button data-v="profile"><svg class="si" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-t="me"></span></button>
</div>

<script>
// Тексты и материалы — RU/EN рядом: правишь одно — правишь второе (правило двуязычия)
const T={
 ru:{hi:"Привет",friend:"друг",freeB:"БЕСПЛАТНО",free:"Все материалы открыты. Бери, пользуйся, делись.",home:"Главная",me:"Профиль",open:"Открыть",soon:"скоро EN",
     tabs:{prod:"Проекты",order:"На заказ",guide:"Гайды",news:"Новости",lib:"Библиотека"},openP:"Открыть проект",req:"Оставить заявку",

};
// витрина: 4 проекта, у каждого свой логотип (как на его сайте) и свой интерактив
const AP_LOGO='<svg viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 16 C12.5 10.5 8.5 9 6 11 C3.3 13.2 3.3 18.8 6 21 C8.5 23 12.5 21.5 16 16 C19.5 10.5 23.5 9 26 11 C28.7 13.2 28.7 18.8 26 21 C23.5 23 19.5 21.5 16 16" stroke="#B4FAB2" stroke-width="2.4"/><path d="M21.8 16 L24.4 18.6 L29.6 12.4" stroke="#2c3341" stroke-width="5.2"/><path d="M21.8 16 L24.4 18.6 L29.6 12.4" stroke="#B4FAB2" stroke-width="2.4"/></svg>';
const FEAT=[
 {id:"ap",url:"https://agentproof.arsysai.com",
  logo:()=>`<span class="lg-ap">${AP_LOGO}<span>AGENT<span class="g">PROOF</span></span></span>`,

  en:{kick:"Prompt request builder",top:"Create PROMPT",foot:`<span class="score"><small class="pp">Partner program</small><b>25<em>%</em> <i class="ps">per<br>referral</i></b></span>`,more:["IMPROVE","HISTORY"],ask:"Describe the task",agents:"8 agents building",

 {id:"au",url:"https://audit.arsysai.com",

async function type(el,text,my){

  async app(x,my){

    ag.innerHTML=`${"<b></b>".repeat(8)}<span>&nbsp;${x.agents}</span>`;

    await type(ask,x.say,my); await wait(300);

function countUp(sc,v,my){const t0=performance.now();
  (function s(ts){if(my!==runId)return;const k=Math.min((ts-t0)/1500,1);sc.textContent=(v*(1-Math.pow(1-k,3))).toFixed(1);if(k<1)requestAnimationFrame(s);})(t0);}
function runLog(){
  const my=++runId;
  FEAT.forEach(f=>{
    const loop=async()=>{ while(my===runId){ await SCENES[f.id](f[L],my); if(reduce) return; await wait(4500); } };
    loop();
  });
}
