<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PROMPT MASTER</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:var(--tg-theme-bg-color,#0f1116);
    --sec:var(--tg-theme-secondary-bg-color,#171a21);
    --text:var(--tg-theme-text-color,#f4f6fb);
    --hint:var(--tg-theme-hint-color,#8b93a3);
    --link:var(--tg-theme-link-color,#4b8dff);
    --btn:var(--tg-theme-button-color,#4b8dff);
    --btn-text:var(--tg-theme-button-text-color,#ffffff);
    --sep:rgba(128,128,128,.18);
    --accent:#00c96d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.45;
    padding:14px 14px calc(20px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  .hd{text-align:center;padding:8px 0 14px}
  .hd h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .hd p{color:var(--hint);font-size:13px;margin-top:4px}
  .gift{background:linear-gradient(135deg,rgba(0,201,109,.16),rgba(75,141,255,.12));border:1px solid var(--sep);
    border-radius:14px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
  .gift b{color:var(--accent)}
  .lbl{font-size:12px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin:18px 4px 8px;font-weight:600}
  .card{width:100%;background:var(--sec);border:none;border-radius:14px;padding:14px 16px;margin-bottom:8px;
    display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;color:var(--text);font-family:inherit;
    transition:transform .12s,opacity .12s}
  .card:active{transform:scale(.985);opacity:.85}
  .card .ic{font-size:22px;flex-shrink:0}
  .card .mid{flex:1;min-width:0}
  .card .t{font-size:15px;font-weight:600}
  .card .d{font-size:12.5px;color:var(--hint);margin-top:1px}
  .card .pr{font-size:14px;font-weight:700;color:var(--accent);flex-shrink:0}
  .card .arr{color:var(--hint);flex-shrink:0}
  .ask{background:var(--btn);color:var(--btn-text)}
  .ask .d,.ask .arr{color:rgba(255,255,255,.75)}
  .foot{text-align:center;color:var(--hint);font-size:11px;margin-top:22px;padding-top:14px;border-top:1px solid var(--sep)}
  .foot a{color:var(--link);text-decoration:none}
</style>
</head>
<body>
  <div class="hd">
    <h1>PROMPT MASTER</h1>
    <p>Система управления AI-моделями</p>
  </div>

  <div class="gift">🎁 <b>Каждый 50-й</b> покупатель любого тарифа получает следующий уровень в подарок.</div>

  <div class="lbl">Тарифы</div>
  <button class="card" data-tg="protocol"><span class="ic">⚡</span><span class="mid"><div class="t">Протокол</div><div class="d">Вход: любая нейросеть отвечает по делу</div></span><span class="pr">$14</span><span class="arr">›</span></button>
  <button class="card" data-tg="app"><span class="ic">📱</span><span class="mid"><div class="t">APP</div><div class="d">Приложение на Claude — собирает промпт</div></span><span class="pr">$99</span><span class="arr">›</span></button>
  <button class="card" data-tg="pro"><span class="ic">🎓</span><span class="mid"><div class="t">PRO</div><div class="d">Метод целиком: справочник, шаблоны</div></span><span class="pr">$148</span><span class="arr">›</span></button>
  <button class="card" data-tg="master"><span class="ic">🚀</span><span class="mid"><div class="t">MASTER</div><div class="d">Всё сразу + Арсенал Мастера</div></span><span class="pr">$229</span><span class="arr">›</span></button>

  <div class="lbl">Помощь</div>
  <button class="card ask" data-tg="ask"><span class="ic">💬</span><span class="mid"><div class="t">Задать вопрос</div><div class="d">Помощник подскажет и поможет выбрать</div></span><span class="arr">›</span></button>

  <div class="lbl">Другие системы</div>
  <button class="card" data-url="https://audit.arsysai.com"><span class="ic">🔍</span><span class="mid"><div class="t">AUDIT</div><div class="d">AI-проверка перед тем, как потерять деньги</div></span><span class="arr">›</span></button>
  <button class="card" data-url="https://secure.arsysai.com"><span class="ic">🛡</span><span class="mid"><div class="t">Защита от утечек кода</div><div class="d">Робот-сторож для твоего проекта</div></span><span class="arr">›</span></button>
  <button class="card" data-tg="arsysai"><span class="ic">🧩</span><span class="mid"><div class="t">Вся экосистема</div><div class="d">Воронка, Assistant, AI-агенты — под заказ</div></span><span class="arr">›</span></button>

  <div class="foot">© Architect Systems AI · <a id="legal">Документы</a></div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg){ tg.ready(); tg.expand(); }
  function openBot(param){
    const url = param==='arsysai' ? 'https://t.me/arsysai_bot'
              : 'https://t.me/protmaster_bot?start=' + param;
    if (tg && tg.openTelegramLink){ tg.openTelegramLink(url); tg.close && setTimeout(()=>tg.close(),150); }
    else window.open(url,'_blank');
  }
  function openUrl(url){ if (tg && tg.openLink){ tg.openLink(url); } else window.open(url,'_blank'); }
  document.querySelectorAll('.card').forEach(b=>{
    b.addEventListener('click',()=>{
      const t=b.getAttribute('data-tg'), u=b.getAttribute('data-url');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      if (t) openBot(t); else if (u) openUrl(u);
    });
  });
  document.getElementById('legal').addEventListener('click',()=>openUrl('https://legal.arsysai.com'));
</script>
</body>
</html>
