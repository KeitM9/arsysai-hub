name: Проверка hub.arsysai.com
# Раз в день проверяет, что оба меню отдают 200. Если нет — job падает,
# и GitHub присылает владельцу репозитория письмо. Секретов не требует.
on:
  schedule:
    - cron: "0 6 * * *"   # каждый день ~09:00 по Турции (06:00 UTC)
  workflow_dispatch: {}     # можно запустить вручную кнопкой в Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Меню @arsysai (корень)
        run: curl -sSf -o /dev/null https://hub.arsysai.com/
      - name: Меню @protmaster (/protmaster)
        run: curl -sSf -o /dev/null https://hub.arsysai.com/protmaster/
